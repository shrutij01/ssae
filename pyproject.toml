[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssae"
version = "0.1.0"
description = "Sparse Shift Autoencoders for identifiable concept representations and steering"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Shruti Joshi" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.20",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "h5py",
    "pyyaml",
    "wandb",
    "transformers",
    "datasets",
    "python-box",
    "cooper-optim",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
bench = ["sae-bench", "transformer-lens>=2.0", "sae-lens>=6.22"]
metrics = ["identifiability-guard @ git+https://github.com/shrutij01/identifiability-guard.git"]
results = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/shrutij01/ssae"
Documentation = "https://shrutij01.github.io/ssae/"
Repository = "https://github.com/shrutij01/ssae.git"
Issues = "https://github.com/shrutij01/ssae/issues"

[tool.setuptools.packages.find]
include = ["ssae*", "evals*", "experiments*", "data*", "utils*", "loaders*"]

[tool.setuptools.package-data]
data = ["vocab/*.json", "categorical/*.json", "behavioral/*.json"]
"experiments.exp05" = ["configs/*.json", "*.md"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Begin public CI with correctness rules that the inherited research codebase
# satisfies. Style and modernization rules can be adopted incrementally.
select = ["E9", "F63", "F7", "F82"]
