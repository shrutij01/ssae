site_name: SSAE
site_description: Sparse Shift Autoencoders learn identifiable concept directions from paired changes in language-model activations
site_author: Shruti Joshi
site_url: https://shrutij01.github.io/ssae/

repo_url: https://github.com/shrutij01/ssae
repo_name: shrutij01/ssae

exclude_docs: |
  # Internal compatibility stubs and protocols without code-backed results are
  # intentionally absent from the public site. Keep them in the repository
  # until their experiments satisfy the publication contract.
  eval/concept-mapping.md
  eval/diagnostics.md
  eval/identifiability.md
  eval/similarity.md
  eval/axbench.md
  eval/saebench.md
  evidence/training-dynamics.md
  notes/model-atlas.md
  notes/representation-similarity.md
  notes/text-generation.md
  getting-started/cluster.md
  guide/sae-baselines.md
  guide/online-training.md
  tutorials/first-ssae.md
  tutorials/concept-probing.md
  tutorials/comparison.md
  block-graph-experiment.md
  posthoc-ssae-block-discovery.md
  step-l0-cross-dataset-progress.md
  step-l0-estimator-progress.md

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/identifiability-guard.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - def_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            docstring_style: google
            docstring_options:
              warn_missing_types: false

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shrutij01/ssae
      name: GitHub Repository

