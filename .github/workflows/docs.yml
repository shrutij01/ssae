name: Deploy documentation to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: mkdocs build --clean --strict --site-dir site
        env:
          PYTHONWARNINGS: "ignore::DeprecationWarning"

      - name: Keep the production artifact lean
        run: |
          find site -type f -name '*.map' -delete
          du -sh site
          size_mb="$(du -sm site | cut -f1)"
          if [ "$size_mb" -gt 32 ]; then
            echo "The generated Pages site is ${size_mb} MB; the budget is 32 MB."
            exit 1
          fi

      - name: Upload the GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
